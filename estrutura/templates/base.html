<!DOCTYPE html>
<html lang="pt-BR">
{% load static %}
{% load i18n %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sistema de Indicadores de Gestão - RJ{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>

<header class="app-header">
    <div class="app-header__inner">
        <a class="brand" href="{% url 'home' %}" aria-label="Página inicial">
            <img class="brand__logo" src="{% static 'logo_gae_rj.png' %}" alt="GAE-RJ">
            <span class="brand__text">
                <strong>SIG - RJ</strong>
                <small>Sistema de Indicadores de Gestão</small>
            </span>
        </a>

        <nav class="auth-links" aria-label="Navegação principal">
            <a href="{% url 'home' %}">Início</a>
            {% if request.user.is_authenticated %}
                <a href="{% url 'password_change' %}">Alterar senha</a>
                <a href="{% url 'logout' %}">Sair</a>
            {% else %}
                <a href="{% url 'login' %}">Entrar</a>
            {% endif %}
        </nav>
    </div>
</header>

<main class="app-main">
    {% block content %}{% endblock %}
</main>

</body>
</html>
